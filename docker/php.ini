; ---------------------------------------------------------------------------
; php.ini untuk image produksi (php:8.2-fpm-alpine).
;
; Nilai di bawah adalah PILIHAN dari default Alpine. Fokusnya:
;   1. EPS yang cukup besar untuk Inertia (payload halaman bisa > 8 MB)
;   2. Error ditulis ke stderr, bukan file, supaya Railway bisa membacanya
;   3. WAKTU EKSEKUSI dibatasi supaya satu request macet tidak menahan worker
;      php-fpm selamanya (Railway akan healthcheck timeout lalu restart)
; ---------------------------------------------------------------------------

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
disable_functions =

; Semua output PHP (display_errors, error_log, dll) ke stderr (fd 2).
; Railway hanya menangkap stdout+stderr, jadi ini WAJIB untuk melihat error.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Batas keras per request. 60 detik cukup untuk query klinis normal; lebih dari
; itu hampir pasti loop/N+1 dan hanya membuang kuota CPU.
max_execution_time = 60
max_input_time = 60
max_input_vars = 5000
memory_limit = 512M

; Batasi upload. Aplikasi ini tidak punya upload file dari user, tapi CSRF token
; + JSON formulir observasi tetap perlu ruang. Lebesgue di client_max_body_size
; di docker/nginx.conf.
post_max_size = 16M
upload_max_filesize = 16M
file_uploads = On
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

; CORS / header
expose_php = Off
default_charset = "UTF-8"
date.timezone = UTC

; Session: cookie session sudah ditangani Laravel; id session yang diacak PHP
; sendiri tidak dipakai. Nilai ini hanya relevan bila SESSION_DRIVER=file.
session.gc_probability = 0
session.use_strict_mode = 1
session.cookie_httponly = 1

; Opcache: wajib untuk produksi. Tanpa ini tiap request meng-compile ulang
; seluruh file PHP (~300 file) dan CPU Railway terbuang percuma.
; validate_timestamps=0 karena kode di dalam image immutable, tidak berubah
; saat container hidup; restart = muat ulang opcode cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Realpath cache: mengurangi syscall saat autoload.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = UTC