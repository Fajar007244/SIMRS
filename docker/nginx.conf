# ---------------------------------------------------------------------------
# nginx front-end for the production image (nginx 1.27 alpine).
#
# WHY nginx + php-fpm in ONE container instead of `php artisan serve`:
#   * `php artisan serve` is SINGLE-THREADED. One slow request blocks every other
#     visitor. It is a dev server and must never run in production.
#   * php-fpm pre-forks N workers, so concurrent users are actually parallel.
#   * nginx serves /build/ assets (hashed by Vite) straight off disk and never
#     boots PHP for them. That is most of the traffic on an Inertia app.
#
# The container runs as the non-root user www-data, so:
#   * the `user` directive is intentionally ABSENT (nginx only honours it when
#     the master runs as root; with it set we would get a warning on every boot),
#   * pid file and all temp/body paths live under /tmp, which is world-writable,
#     so no /var/run or /var/cache chown is required.
#   * every temp path must stay under /tmp: nothing else in the image is
#     writable by www-data except this file (see the port note below) and
#     storage/ + bootstrap/cache/.
#
# ===========================================================================
# PORT - READ THIS BEFORE CHANGING THE `listen` LINE
# ===========================================================================
# Render does NOT tell the container which port to listen on by convention. It
# picks a random high port, exports it as $PORT, and routes public traffic to
# whatever is bound there. A fixed 8080 is therefore only correct for local
# `docker compose`, where nothing injects PORT.
#
# This file is copied to /etc/nginx/nginx.conf (the MAIN config, not a
# conf.d/server fragment). docker/entrypoint.sh rewrites the `listen` line
# below on every container start:
#
#     sed -i "s/^\( *listen *\)8080/\1${PORT:-8080}/" /etc/nginx/nginx.conf
#
# Consequences you MUST respect when editing this file:
#   1. Keep exactly ONE `listen` directive, and keep the literal `8080` in it.
#      The sed pattern is anchored on `listen <spaces> 8080`; renaming the
#      default, dropping the spaces, or adding a second listen line breaks the
#      substitution and the container ends up listening where Render is not
#      looking. The entrypoint verifies the result after sed and refuses to
#      start nginx if the port did not take effect, so this cannot fail
#      silently - but it does fail the deploy.
#   2. There is deliberately NO `listen [::]:<port>;` line. nginx would have to
#      bind IPv6 as well, and if the sandbox/container kernel has IPv6 disabled
#      that bind errors out. Render's proxy reaches the container over IPv4, so
#      an IPv4-only listener is both sufficient and safer.
#   3. The entrypoint runs as www-data, so /etc/nginx/nginx.conf is
#      chown root:www-data + chmod 0664 at build time (see Dockerfile).
#      Without that, `sed -i` fails with "Permission denied" and the container
#      refuses to start.
# ===========================================================================

worker_processes  auto;
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /dev/stdout  main;

    # Render's front proxy -> our container. Do not hardcode an allow/deny list;
    # Rails/TrustProxies + real_ip below handle the X-Forwarded-* headers.
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;
    reset_timedout_connection on;

    # Writable scratch dirs for non-root nginx.
    client_body_temp_path  /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    # Real client IP from Render's proxy. Needed so Laravel sees the true
    # REMOTE_ADDR for sessions, throttle:login, and future audit columns.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # 32 MB. The app has no user uploads, but the observasi form posts a large
    # Inertia JSON payload; PHP's post_max_size (16M, docker/php.ini) still
    # applies, so keep nginx at or above it.
    client_max_body_size 32m;
    client_body_buffer_size 256k;

    # --- gzip ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    # --- rate limit zones ---------------------------------------------------
    # Login brute-force protection. `throttle:login` in Laravel is the primary
    # control; this is defence in depth at the web server.
    limit_req_zone $binary_remote_addr zone=laravel_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=laravel_global:10m rate=120r/m;
    limit_req_status 429;

    server {
        # The ONLY listen directive in this file. 8080 is the local default and
        # the literal the entrypoint's sed pattern matches on; on Render it is
        # replaced with the injected $PORT before nginx is launched.
        # Do NOT add a second `listen` (e.g. an IPv6 one) - see the header.
        listen      8080 default_server;
        server_name _;
        charset     utf-8;

        root  /var/www/html/public;
        index index.php index.html;

        # ---------------------------------------------------------------
        # Laravel/Inertia front controller.
        # `$uri $uri/ /index.php` is REQUIRED: Inertia pages are real URLs
        # (/pasien, /encounters/{id}/cppt, ...) with no matching file on disk.
        # Without the /index.php fallback nginx returns 404 for every page
        # route, and GET / returns nginx's own index listing.
        # ---------------------------------------------------------------
        location / {
            limit_req zone=laravel_global burst=40 nodelay;
            try_files $uri $uri/ /index.php;
        }

        # Login is a plain Blade POST. Tighter zone than the rest of the app.
        location = /login {
            limit_req zone=laravel_login burst=5 nodelay;
            try_files $uri $uri/ /index.php;
        }

        # Healthcheck target. Laravel registers this in bootstrap/app.php
        # (`health: '/up'`). It must stay cheap and unauthenticated.
        # Render probes this exact path (healthCheckPath in render.yaml).
        location = /up {
            access_log off;
            try_files $uri /index.php;
        }

        # ---------------------------------------------------------------
        # Vite build output. Filenames contain a content hash, so they are
        # safe to cache forever: a new deploy changes the filename, not the
        # bytes. ^~ beats any regex location below.
        # ---------------------------------------------------------------
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # Uploaded/symlinked public storage is not used by this app, but if it
        # is ever enabled it must not be cached for a year.
        location ^~ /storage/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # Hashed assets may also appear under /assets/ depending on the Vite
        # base path.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # ---------------------------------------------------------------
        # Never execute or serve dotfiles (.env, .git, editor swap files).
        # /.well-known/ is allowed so ACME/Let's Encrypt validation can work.
        # NOTE: Render terminates TLS in front of this service, so certificate
        # validation never reaches nginx. The exception is kept anyway: it costs
        # nothing and makes the config usable if TLS is ever moved inward.
        # ---------------------------------------------------------------
        location ~ /\.(?!well-known/) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;

            include        /etc/nginx/fastcgi_params;

            # $realpath_root resolves symlinks and is always an absolute path
            # ending WITHOUT a trailing slash, so appending $fastcgi_script_name
            # yields a valid absolute SCRIPT_FILENAME. A relative or
            # double-slashed value is the classic cause of
            # "Primary script unknown" / 404 from PHP-FPM.
            fastcgi_param  SCRIPT_FILENAME   $realpath_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT     $realpath_root;
            fastcgi_param  HTTPS             $https if_not_empty;

            # Inertia + Blade. index.php itself must NEVER be cached, or a
            # browser will keep booting an old app shell after a deploy.
            add_header     Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header     Pragma          "no-cache" always;
            add_header     X-Content-Type-Options "nosniff" always;
            add_header     X-Frame-Options "SAMEORIGIN" always;
            add_header     Referrer-Policy "strict-origin-when-cross-origin" always;

            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout   65s;
            fastcgi_send_timeout   65s;
            fastcgi_connect_timeout 5s;
            fastcgi_buffer_size     32k;
            fastcgi_buffers         8 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Any other .php file (a stray upload, a leftover probe) is not a real
        # route. 404 instead of executing it.
        location ~ \.php$ {
            return 404;
        }

        # Plain files that are safe to cache briefly (favicon, robots.txt).
        location ~* \.(?:ico|txt)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }
    }
}
