; ---------------------------------------------------------------------------
; php-fpm pool config for the production image.
; Overridden via: COPY docker/php-fpm.d/*.conf /usr/local/etc/php-fpm.d/
;
; File name is deliberately "zz-app.conf" so it sorts LAST in the include glob
; (www.conf is loaded first), which means every value here wins.
;
; Principle: run as a NON-ROOT user whose uid/gid MUST match what
; docker/entrypoint.sh chowns storage/ and bootstrap/cache/ to.
; ---------------------------------------------------------------------------

[www]
user = www-data
group = www-data

; TCP on all interfaces, port 9000. nginx lives in the same container and
; connects to 127.0.0.1:9000. The port is never published to the host.
listen = 0.0.0.0:9000

; ---------------------------------------------------------------------------
; Process manager
; ---------------------------------------------------------------------------
; ondemand: spawn a worker only when a request arrives. Railway bills memory,
; and this app has low-to-moderate traffic, so do not keep idle workers alive.
pm = ondemand
pm.max_children = 10
; Hard ceiling: 10 workers x 3 restarts = 30 PHP processes. Combined with
; pm.max_requests, a slow memory leak recycles workers instead of getting the
; whole container OOM-killed.
pm.max_requests = 500
pm.process_idle_timeout = 30s

; ---------------------------------------------------------------------------
; Timeouts. Must sit ABOVE php.ini max_execution_time (60s), otherwise fpm
; SIGKILLs the worker mid-script and you get a 502 with no PHP error at all.
; ---------------------------------------------------------------------------
request_terminate_timeout = 65s
request_slowlog_timeout = 10s
slowlog = /dev/stderr

; ---------------------------------------------------------------------------
; Endpoints + visibility. Railway only collects stdout/stderr, so pool events
; must be logged to stderr to be visible in the deploy logs.
; ---------------------------------------------------------------------------
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

access.log = /dev/stdout
access.format = "%R - %u %t \"%m %r\" %s %{milli}dms %kKB"

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 512M